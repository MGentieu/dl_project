task: cv_classification
seed: 42
data:
  dataset: caltech101
  root: ./data
  img_size: 224
  batch_size: 128
  num_workers: 2   # Réduit pour éviter les erreurs sur certains environnements locaux
  val_split: 0.1

model:
  arch: resnet18
  pretrained: true

train:
  epochs: 8
  optimizer: adam
  lr: 1.0e-3
  scheduler: cosine

output_dir: outputs
